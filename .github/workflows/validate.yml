name: Validate plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Missing image repair regression tests
        run: php tests/missing-product-images.php
      - name: Validate WooCommerce visibility
        run: php tests/woocommerce-visibility.php
