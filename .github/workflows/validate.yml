name: Validate plugin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_DATABASE: wci_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfixture-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Check member loyalty promotion calculations
        run: php tests/member-loyalty-promotion-policy.php
      - name: Check email log privacy, retention, quotas and scoped loading
        run: |
          php tests/email-tracking.php
          node --check modules/email-tracking/admin.js
      - name: Check live WooCommerce insights preservation, limits and scope
        run: |
          php tests/wc-live-insights.php
          php tests/wc-live-insights.php legacy
          node tests/wc-live-insights-ui.js
      - name: Check real SQL reports against disposable HPOS and legacy fixtures
        env:
          WUTM_TEST_MYSQL_DB: wci_fixture
        run: php tests/wc-live-insights-sql.php
      - name: Check maps and content overview preservation, permissions and scope
        run: |
          php tests/content-modules.php
          php tests/content-modules.php frontend
      - name: Check product badge preservation and scoped loading
        run: |
          php tests/product-badges.php
          node tests/product-badges-ui.js
      - name: Check admin menu editor ownership
        run: php tests/admin-menu-editor-owners.php
      - name: Check customer-entered product pricing
        run: php tests/product-custom-price.php
      - name: Check WC shipping module merge
        run: |
          php tests/wc-shipping-merge.php
          php tests/711-phone.php
          node tests/711-phone-ui.js
      - name: Check product shipping schedules, permissions, query privacy and email compatibility
        run: php tests/shipping-progress.php
      - name: Check shipping admin script
        run: node --check assets/js/shipping-progress-admin.js
      - name: Check commerce admin data preservation and scoped assets
        run: php tests/admin-commerce-ui.php
      - name: Check product editor scripts
        run: |
          node --check assets/js/product-size-chart-admin.js
          node --check assets/js/wc-product-visibility.js
      - name: Check product category menu hierarchy
        run: php tests/product-category-menu-tree.php
      - name: Check media-grid fallback notice stays hidden
        run: node tests/notice-center-fallback.js
      - name: Check SEO schema, indexing, taxonomy and conflict protection
        run: php tests/seo-core.php
      - name: Check TranslatePress discovery and dictionary writes
        run: php tests/ai-translate-translatepress.php
      - name: Check resumable AI scan, publication integrity and error handling
        run: |
          php tests/ai-translate-batched-scan.php
          node tests/ai-translate-scan.js
      - name: Check translated language detection and cache integrity
        run: php tests/page-cache-translatepress.php
      - name: Check page cache policy, permissions and scoped assets
        run: php tests/page-cache-policy.php
      - name: Check page cache with real HTTP requests and nested output buffers
        run: node tests/page-cache-http.js
      - name: Check FAQ permissions, preservation and interface script loading
        run: |
          php tests/interface-fixture.php policy
          node --check assets/js/product-faq-admin.js
          node --check assets/js/custom-cursor.js
          node --check assets/js/page-transition.js
          node tests/page-transition-state.js
      - name: Check SEO editor analysis
        run: |
          npm install --prefix "$RUNNER_TEMP/wutm-seo-tests" linkedom@0.18.12 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/wutm-seo-tests/node_modules" node tests/seo-analysis.js
          NODE_PATH="$RUNNER_TEMP/wutm-seo-tests/node_modules" node tests/content-modules-ui.js
      - name: Check changelog is current
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_VERSION="$(grep -E '^[[:space:]]*\* Version:' wu-toolbox-modular.php | sed -E 's/^[[:space:]]*\* Version:[[:space:]]*//' | tr -d '\r')"
          test -n "$PLUGIN_VERSION"
          grep -Fq "<h4>${PLUGIN_VERSION}</h4>" core/github-release-updater.php
